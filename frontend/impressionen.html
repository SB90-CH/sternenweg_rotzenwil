<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Impressionen und Bilder vom Sternenweg Rotzenwil.">
    <title>Impressionen – Sternenweg Rotzenwil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar" aria-label="Hauptnavigation">
            <a href="index.html#start" class="logo">✦ Sternenweg Rotzenwil</a>
            <ul class="nav-links">
                <li><a href="index.html#start">Start</a></li>
                <li><a href="index.html#sternweg">Der Sternenweg</a></li>
                <li><a href="index.html#karte">Karte</a></li>
                <li><a href="parkplaetze.html">Parkplätze</a></li>
                <li><a href="impressionen.html" aria-current="page">Impressionen</a></li>
                <li><a href="index.html#kontakt">Kontakt</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="parking-hero">
            <div class="container">
                <p class="hero-kicker">Einblicke in den Sternenweg</p>
                <h1>Impressionen</h1>
                <p>Entdecke stimmungsvolle Eindrücke vom Sternenweg Rotzenwil.</p>
            </div>
        </section>
        <section class="section" aria-label="Impressionen-Fotos">
            <div class="container">

                <div class="gallery impressionen-gallery" aria-label="Bildergalerie Sternenweg">
                    <figure class="impressionen-photo">
                        <img src="images/galerie/impression-01.jpg" alt="Verschneiter Sternenweg mit goldenem Wegweiserstern" loading="lazy">
                    </figure>
                    <figure class="impressionen-photo">
                        <img src="images/galerie/impression-02.jpg" alt="Winterliche Station mit Schafen, Tannen und Sternen" loading="lazy">
                    </figure>
                    <figure class="impressionen-photo">
                        <img src="images/galerie/impression-03.jpg" alt="Weihnachtlich geschmückte Hütte mit Esel und Samichlaus" loading="lazy">
                    </figure>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="container"><p>© <span id="year"></span> Sternenweg Rotzenwil</p></div>
    </footer>
    <script src="js/main.js"></script>
